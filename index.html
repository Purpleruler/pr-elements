<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pr-elements — Purple Ruler web components</title>
  <style>
    body{ margin:0; padding:40px 16px; background:#f5f1fb; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; color:#241a33; }
    h1{ text-align:center; font-size:22px; }
    p.sub{ text-align:center; color:#6b6280; max-width:560px; margin:6px auto 30px; }
    code{ background:#efe8fb; padding:2px 6px; border-radius:6px; }
  </style>
</head>
<body>
  <h1>Purple Ruler web components</h1>
  <p class="sub">This page is the live host. The <code>pr-placement</code> element below is the same file Wix loads via its Server URL. Add a Custom Element in Wix, set Server URL to <code>placement.js</code> and Tag Name to <code>pr-placement</code>.</p>

  <!-- Live demo of the component (no member token = preview mode) -->
  <pr-placement subject="maths"></pr-placement>

  <script src="./placement.js"></script>
</body>
</html>
